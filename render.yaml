services:
  # ── PostgreSQL Database ────────────────────────────────────────────────
  - type: postgresql
    name: automated-code-review-tool-db
    plan: standard
    region: oregon
    postgresqlVersion: "16"
    diskSizeGB: 10
    databaseName: automated-code-review-tool
    databaseUser: automated-code-review-tool
    # databasePassword is auto-generated by Render

  # ── Redis Cache ────────────────────────────────────────────────────────
  - type: redis
    name: automated-code-review-tool-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # ── Spring Boot API ──────────────────────────────────────────────────
  - type: web
    name: automated-code-review-tool-api
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /actuator/health
    healthCheckTimeout: 120
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: automated-code-review-tool-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: automated-code-review-tool-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: automated-code-review-tool-db
          property: password
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: automated-code-review-tool-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: redis
          name: automated-code-review-tool-redis
          property: port
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ML_WORKER_URL
        sync: false
      - key: ML_WORKER_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: API_KEY_RPM
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  # NOTE: In Phase 0 no fine-tuned model checkpoint exists yet.
  # MODEL_NAME is intentionally set to "none" so the FastAPI worker
  # loads in fallback-only mode — all detections go through the
  # rule-based scanner.  When a trained checkpoint is added later,
  # set MODEL_NAME to the HuggingFace repo (e.g. "org/codebert-sonar")
  # and unset it back to "none" to disable the fallback path.
  # HF_TOKEN should be populated in Render when a real checkpoint is used.

  # ── FastAPI ML Worker ─────────────────────────────────────────────────
  - type: web
    name: automated-code-review-tool-ml-worker
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: apps/ml-worker/Dockerfile
    dockerContext: apps/ml-worker
    healthCheckPath: /ml/health
    healthCheckTimeout: 120
    autoDeploy: true
    # Standard plan (2 GB RAM) is sufficient for fallback-only mode.
    # No PyTorch model is loaded when MODEL_NAME="none".
    envVars:
      - key: MODEL_NAME
        value: "none"
      - key: HF_TOKEN
        sync: false
      - key: ML_WORKER_SECRET
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
