databases:
  - name: automated-code-review-tool-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: automated_code_review_tool
    user: automated_code_review_tool
    diskSizeGB: 15
    ipAllowList: []

services:
  - type: keyvalue
    name: automated-code-review-tool-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: automated-code-review-tool-ml-worker
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: apps/ml-worker/Dockerfile
    dockerContext: .
    healthCheckPath: /ml/health
    autoDeployTrigger: checksPass
    envVars:
      # uvicorn listens on 8000 (apps/ml-worker/Dockerfile); tell Render so the
      # health check and the hostport reference below use that port.
      - key: PORT
        value: "8000"
      - key: MODEL_NAME
        value: none
      - key: ML_WORKER_SECRET
        generateValue: true

  - type: web
    name: automated-code-review-tool-api
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      # Spring Boot listens on 8080 (apps/api/Dockerfile).
      - key: PORT
        value: "8080"
      # Render exposes a postgresql:// connection string, while Spring expects
      # a jdbc:postgresql:// URL. Set this to the database's internal JDBC URL.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: automated-code-review-tool-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: automated-code-review-tool-db
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: automated-code-review-tool-redis
          property: connectionString
      # Render's private-network hostname carries a generated suffix, so the
      # address must come from the service reference, not a hard-coded name.
      # application.yml builds http://<hostport> from this value.
      - key: ML_WORKER_HOSTPORT
        fromService:
          type: web
          name: automated-code-review-tool-ml-worker
          property: hostport
      - key: ML_WORKER_SECRET
        fromService:
          type: web
          name: automated-code-review-tool-ml-worker
          envVarKey: ML_WORKER_SECRET
      # The browser reaches the API only through the dashboard's same-origin
      # proxy (onrender.com is a public suffix, so separate *.onrender.com
      # services are cross-site and SameSite=Lax cookies would never be sent).
      # Set both to the dashboard's public origin, e.g.
      # https://automated-code-review-tool-web.onrender.com (or your custom
      # domain), and set the GitHub OAuth App callback to
      # <that origin>/api/auth/callback. Render offers no Blueprint reference
      # to another service's public URL, so these are entered once by hand.
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional comma-separated extra dashboard origins (e.g. a custom domain
      # plus the onrender.com host). Empty means FRONTEND_URL only.
      - key: ALLOWED_ORIGINS
        sync: false
      # GitHub webhooks (and API-key clients: VS Code, GitHub Action) call the
      # API's own public URL, so webhook delivery does not depend on the
      # dashboard: https://<api host>/api/webhook/github
      - key: WEBHOOK_CALLBACK_URL
        sync: false
      # Default "read:user repo" keeps private repositories working; public-only
      # deployments can narrow it to "public_repo admin:repo_hook".
      - key: GITHUB_OAUTH_SCOPES
        value: read:user repo
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: API_KEY_RPM
        value: "60"
      # Render fronts services with Cloudflare and its proxy appends to
      # X-Forwarded-For, so the auth rate limiter keys on Cloudflare's
      # True-Client-IP, trusted only when the peer is Render's private proxy.
      - key: AUTH_TRUSTED_PROXIES
        value: 10.0.0.0/8
      - key: AUTH_CLIENT_IP_HEADER
        value: True-Client-IP

  - type: web
    name: automated-code-review-tool-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      # `next start` honours PORT; keep it on the port the image exposes.
      - key: PORT
        value: "3000"
      # Same-origin API proxy target (server-side, read per request): the API's
      # private-network host:port. The browser never sees this address.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: automated-code-review-tool-api
          property: hostport
