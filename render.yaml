services:
  # ── PostgreSQL Database ────────────────────────────────────────────────
  - type: postgresql
    name: automated-code-review-tool-db
    plan: standard
    region: oregon
    postgresqlVersion: "16"
    diskSizeGB: 10
    databaseName: automated-code-review-tool
    databaseUser: automated-code-review-tool
    # databasePassword is auto-generated by Render

  # ── Redis Cache ────────────────────────────────────────────────────────
  - type: redis
    name: automated-code-review-tool-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # ── Spring Boot API ──────────────────────────────────────────────────
  - type: web
    name: automated-code-review-tool-api
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /actuator/health
    healthCheckTimeout: 120
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: automated-code-review-tool-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: automated-code-review-tool-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: automated-code-review-tool-db
          property: password
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: automated-code-review-tool-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: redis
          name: automated-code-review-tool-redis
          property: port
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ML_WORKER_URL
        sync: false
      - key: ML_WORKER_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: API_KEY_RPM
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  # ── FastAPI ML Worker ─────────────────────────────────────────────────
  - type: web
    name: automated-code-review-tool-ml-worker
    region: oregon
    plan: standard
    runtime: docker
    dockerfilePath: apps/ml-worker/Dockerfile
    dockerContext: apps/ml-worker
    healthCheckPath: /ml/health
    healthCheckTimeout: 120
    autoDeploy: true
    # Larger plan needed for PyTorch + CodeBERT model (~500MB)
    # Standard plan provides 2GB RAM
    envVars:
      - key: MODEL_NAME
        value: "microsoft/codebert-base"
      - key: HF_TOKEN
        sync: false
      - key: ML_WORKER_SECRET
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
