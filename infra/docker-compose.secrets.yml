# docker-compose.secrets.yml - Production stack with secrets management
#
# Docker Compose V2 secrets syntax. Secrets must be created externally before
# `docker compose up` and are mounted read-only at /run/secrets/<name>.
#
# Usage:
# 1. Create secrets files:
#    echo "automated-code-review-tool_production_password" > postgres_password.txt
#    echo "automated-code-review-tool_production_user" > postgres_user.txt
#    echo "$(openssl rand -base64 32)" > redis_password.txt
#
# 2. Load into the swarm (Docker Swarm) or use --project-directory with a
#    secrets directory. For local dev with Docker Desktop, secrets can be
#    stored under the compose project directory:
#
#    mkdir -p .secrets
#    echo "<value>" > .secrets/postgres_password
#    echo "<value>" > .secrets/postgres_user
#    echo "<value>" > .secrets/redis_password
#
# 3. Deploy:
#    docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Note: The :external: source is "file" for Docker Desktop secrets.
#

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user

  redis:
    secrets:
      - redis_password
    # Read the password file content with a subshell; we cannot shell-script
    # inside the command array, so wrap the entrypoint with sh -c.
    entrypoint:
      - "sh"
      - "-c"
      - "exec redis-server --save '' --appendonly no --requirepass \"$$(cat /run/secrets/redis_password)\" --bind 0.0.0.0 --protected-mode yes"

  api:
    environment:
      SPRING_DATASOURCE_USERNAME_FILE: /run/secrets/postgres_user
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_password
      SPRING_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - postgres_user
      - postgres_password
      - redis_password
    # Additional secrets for production:
    # - jwt_secret
    # - encryption_key
    # - github_client_secret
    # - ml_worker_secret

secrets:
  postgres_password:
    file: .secrets/postgres_password
  postgres_user:
    file: .secrets/postgres_user
  redis_password:
    file: .secrets/redis_password