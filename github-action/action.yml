name: 'automated-code-review-tool Code Review'
description: 'Scan the files changed in a pull request with an automated-code-review-tool API and annotate findings on added lines'
author: 'tanmay-alpha'

inputs:
  api-url:
    description: 'HTTPS base URL of an automated-code-review-tool API'
    required: true
  api-key:
    description: 'automated-code-review-tool API key from the dashboard'
    required: true
  github-token:
    description: 'Token used to list the pull-request files and read their contents'
    required: true
  fail-threshold:
    description: 'Minimum quality score (0-100), computed from findings on added lines. Below this the action fails.'
    required: false
    default: '60'
  fetch-timeout-ms:
    description: 'Timeout for each HTTP request to the API and GitHub (1000-300000 ms).'
    required: false
    default: '30000'
  max-files:
    description: 'Maximum number of changed files to scan (1-3000). Each file is one API request.'
    required: false
    default: '50'

outputs:
  quality-score:
    description: 'Quality score (0-100) computed from findings on added lines; empty when no file was scanned.'
  findings-count:
    description: 'Number of findings on added lines.'
  critical-count:
    description: 'Number of critical findings on added lines.'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'eye'
  color: 'blue'
