name: 'automated-code-review-tool Code Review'
description: 'Semantic code review that catches anti-patterns linters miss'
author: 'automated-code-review-tool'

inputs:
  api-url:
    description: 'automated-code-review-tool API URL (e.g. https://api.automated-code-review-tool.dev)'
    required: true
  api-key:
    description: 'automated-code-review-tool API key from dashboard (Settings → API Key)'
    required: true
  language:
    description: 'Primary language of the PR (python | javascript | java)'
    required: false
    default: 'python'
  fail-threshold:
    description: 'Minimum quality score (0-100). Below this the action fails.'
    required: false
    default: '60'
  fetch-timeout-ms:
    description: 'Timeout for HTTP requests to the API and GitHub (1000-300000 ms).'
    required: false
    default: '30000'

outputs:
  quality-score:
    description: 'Quality score reported by automated-code-review-tool (0-100).'
  findings-count:
    description: 'Total number of findings returned.'
  critical-count:
    description: 'Number of CRITICAL findings.'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'eye'
  color: 'blue'
