name: ci-integrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github-action/**"
      - "apps/vscode-ext/**"
      - "contracts/**"
      - ".github/workflows/ci-integrations.yml"
  pull_request:
    paths:
      - "github-action/**"
      - "apps/vscode-ext/**"
      - "contracts/**"
      - ".github/workflows/ci-integrations.yml"

permissions:
  contents: read

concurrency:
  group: ci-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Matches the action's `runs.using: node24` runtime.
          node-version: "24"
          cache: npm
          cache-dependency-path: github-action/package-lock.json
      - name: Install dependencies
        working-directory: github-action
        run: npm ci
      - name: Audit all dependencies
        working-directory: github-action
        run: npm audit --audit-level=high
      - name: Test
        working-directory: github-action
        run: npm test
      - name: Rebuild distribution
        working-directory: github-action
        run: npm run build
      - name: Verify committed distribution
        run: git diff --exit-code -- github-action/dist

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/vscode-ext/package-lock.json
      - name: Install dependencies
        working-directory: apps/vscode-ext
        run: npm ci
      - name: Audit all dependencies
        working-directory: apps/vscode-ext
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: apps/vscode-ext
        run: npm run lint
      - name: Compile
        working-directory: apps/vscode-ext
        run: npm run compile
      - name: Test
        working-directory: apps/vscode-ext
        run: npm test
