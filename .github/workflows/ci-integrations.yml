name: ci-integrations

on:
  push:
    branches: [main]
    paths:
      - "github-action/**"
      - "apps/vscode-ext/**"
      - ".github/workflows/ci-integrations.yml"
  pull_request:
    paths:
      - "github-action/**"
      - "apps/vscode-ext/**"
      - ".github/workflows/ci-integrations.yml"

concurrency:
  group: ci-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: github-action/package-lock.json
      - name: Install dependencies
        working-directory: github-action
        run: npm ci
      - name: Audit production dependencies
        working-directory: github-action
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        working-directory: github-action
        run: npm test
      - name: Rebuild distribution
        working-directory: github-action
        run: npm run build
      - name: Verify committed distribution
        run: git diff --exit-code -- github-action/dist

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/vscode-ext/package-lock.json
      - name: Install dependencies
        working-directory: apps/vscode-ext
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/vscode-ext
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: apps/vscode-ext
        run: npm run lint
      - name: Compile
        working-directory: apps/vscode-ext
        run: npm run compile
      - name: Test
        working-directory: apps/vscode-ext
        run: npm test
