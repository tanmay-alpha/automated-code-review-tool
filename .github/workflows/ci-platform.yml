name: ci-platform

# Repository-wide checks: deployment config validation, secret scanning and a
# filesystem dependency/IaC scan. Runs on every change because a leaked secret
# or a vulnerable lockfile can land in any directory.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate Render Blueprint against the official schema
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema==0.39.0
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - name: Validate workflow files
        run: |
          python -m pip install --disable-pip-version-check check-jsonschema==0.39.0
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          check-jsonschema --builtin-schema vendor.github-actions github-action/action.yml

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action comments on the pull request when it finds a leak.
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Scan every commit in the push/PR range, not only the tip.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required when the repository belongs to an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # trivy-action tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23):
      # pin the action by commit and the scanner to a verified release.
      - name: Trivy (lockfiles, pom.xml, requirements, Dockerfiles, Compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: "apps/web/node_modules,apps/vscode-ext/node_modules,github-action/node_modules"
