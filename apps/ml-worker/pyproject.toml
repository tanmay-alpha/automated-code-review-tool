[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = false
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# Be lenient with third-party ML deps that don't ship type stubs.
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "sklearn.*",
    "numpy.*",
    "pandas.*",
    "fastapi.*",
    "pydantic.*",
    "yaml",
]
ignore_missing_imports = true
