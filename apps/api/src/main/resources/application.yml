spring:
  application:
    name: automated-code-review-tool-api

  server:
    max-http-request-header-size: 4KB

  servlet:
    multipart:
      max-request-size: 1MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/automated-code-review-tool}
    username: ${SPRING_DATASOURCE_USERNAME:automated-code-review-tool}
    password: ${SPRING_DATASOURCE_PASSWORD:automated-code-review-tool_local}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:}


app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:true}
  request:
    max-body-size: ${APP_MAX_BODY_SIZE:1048576}   # 1MB default for webhook + scan endpoints
    max-query-size: 4096   # 4KB
    max-header-size: 4096  # 4KB
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900      # 15 minutes
    refresh-token-expiry: 604800  # 7 days
  webhook:
    callback-url: ${WEBHOOK_CALLBACK_URL:http://localhost:8080/api/webhook/github}
  ratelimit:
    api-key:
      requests-per-minute: ${API_KEY_RPM:60}

  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    oauth-redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/auth/callback

  ml-worker:
    url: ${ML_WORKER_URL:http://localhost:8000}
    secret: ${ML_WORKER_SECRET}

  encryption:
    key: ${ENCRYPTION_KEY}

  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
