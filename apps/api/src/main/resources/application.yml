server:
  max-http-request-header-size: 8KB   # Tomcat default; auth cookies need the headroom

spring:
  application:
    name: automated-code-review-tool-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/automated-code-review-tool}
    username: ${SPRING_DATASOURCE_USERNAME:automated-code-review-tool}
    password: ${SPRING_DATASOURCE_PASSWORD:automated-code-review-tool_local}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 30000

  jpa:
    # Lazy associations are loaded inside service transactions or via fetch graphs.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:}


app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Comma-separated browser origins (scheme://host[:port]) allowed to make
  # cookie-authenticated requests (CORS + CSRF origin check). Empty: the
  # origin of frontend-url.
  allowed-origins: ${ALLOWED_ORIGINS:}
  cookie-secure: ${COOKIE_SECURE:true}
  request:
    max-body-size: ${APP_MAX_BODY_SIZE:1048576}   # 1MB default for webhook + scan endpoints
    max-query-size: 4096   # 4KB
    max-header-size: 4096  # 4KB
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900      # 15 minutes
    refresh-token-expiry: 604800  # 7 days
  webhook:
    callback-url: ${WEBHOOK_CALLBACK_URL:http://localhost:8080/api/webhook/github}
  ratelimit:
    api-key:
      requests-per-minute: ${API_KEY_RPM:60}
    auth:
      # Comma-separated IPs/CIDRs of reverse proxies whose X-Forwarded-For is
      # trusted. Empty: the direct peer address is the client IP.
      trusted-proxies: ${AUTH_TRUSTED_PROXIES:}
      # Header holding the original client IP, set by a CDN in front of the
      # trusted proxy (e.g. True-Client-IP on Render/Cloudflare). Only read
      # from trusted-proxies peers; empty disables it.
      client-ip-header: ${AUTH_CLIENT_IP_HEADER:}

  github:
    # REST API root (GitHub Enterprise Server: https://<host>/api/v3).
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    oauth-redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/auth/callback
    # Space-separated. "repo" is needed for private repositories; public-only
    # deployments can use "public_repo admin:repo_hook".
    oauth-scopes: ${GITHUB_OAUTH_SCOPES:read:user repo}

  ml-worker:
    url: ${ML_WORKER_URL:http://${ML_WORKER_HOSTPORT:localhost:8000}}
    secret: ${ML_WORKER_SECRET}

  encryption:
    key: ${ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
